name: Build and Deploy to Web Branch

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 8

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install deps
      run: pnpm install

    - name: Docs build
      env:
        NODE_OPTIONS: --max_old_space_size=8192
      run: pnpm run docs:build

    - name: Prepare dist for deployment
      run: |
        mkdir -p dist
        if [ -d "src/.vuepress/dist" ]; then
          echo "Copying from src/.vuepress/dist"
          cp -r src/.vuepress/dist/* dist/
        else
          echo "ERROR: src/.vuepress/dist not found!"
          exit 1
        fi

    - name: Deploy to web branch
      if: github.event_name == 'push'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        
        # 确保 dist 存在
        if [ ! -d "dist" ]; then
          echo "ERROR: dist directory not found!"
          exit 1
        fi
        
        # 切换或创建 web 分支
        git fetch origin web || true
        git checkout web || git checkout --orphan web
        
        # 清空并复制新内容（从上级目录复制，因为 dist 在切换分支前的目录中）
        rm -rf ./*
        cp -r ../dist/* ./
        touch .nojekyll
        
        git add .
        git commit -m "Deploy from main branch - ${{ github.sha }}"
        git push origin web --force